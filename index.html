<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-main: #f0f4f1;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(200, 214, 203, 0.6);
            --accent: #10b981; /* Verde Esmeralda */
            --accent-hover: #059669;
            --accent-light: #d1fae5;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --shadow-sm: 0 2px 8px rgba(16, 185, 129, 0.04);
            --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.06);
            --radius-pill: 9999px;
            --radius-box: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* PAINEL SUPERIOR FLUTUANTE (DOCK) */
        .top-dock {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-md);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .dock-brand {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: var(--accent);
            border-right: 2px solid #e2e8f0;
            padding-right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dock-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dock-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .dock-btn:hover {
            background: var(--accent-light);
            color: var(--accent-hover);
        }

        .dock-btn.primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .dock-btn.primary:hover {
            background: var(--accent-hover);
            color: white;
        }

        .dock-divider {
            width: 1px;
            height: 24px;
            background-color: #cbd5e1;
        }

        /* Modificadores de cor integrados */
        .color-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #e4e9e5;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .color-pill input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        .color-pill input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-pill input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        /* WORKSPACE */
        .workspace {
            flex: 1;
            display: flex;
            margin-top: 90px;
            height: calc(100vh - 90px);
            position: relative;
        }

        /* NAVEGADOR LATERAL */
        .slide-navigator {
            width: 190px;
            background: transparent;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .nav-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .thumb-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: white;
            border-radius: var(--radius-box);
            border: 2px solid transparent;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        .thumb-box:hover {
            transform: translateY(-2px);
            border-color: var(--accent-light);
        }

        .thumb-box.active {
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
            color: var(--accent-hover);
            background: var(--accent-light);
        }

        /* PALCO CENTRAL DE EDIÇÃO */
        .stage-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
        }

        .canvas-container {
            position: relative;
            background: white;
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-md);
        }

        .canvas {
            width: 854px;
            height: 480px;
            border-radius: var(--radius-box);
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }

        /* ELEMENTOS DO DESIGN */
        .element {
            position: absolute;
            min-width: 40px;
            min-height: 20px;
            padding: 6px;
            cursor: grab;
            outline: none;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed transparent;
            border-radius: 6px;
        }

        .element:active { cursor: grabbing; }
        .element:hover { border-color: #a7f3d0; }
        
        .element.selected {
            border: 2px solid var(--accent) !important;
            background: rgba(16, 185, 129, 0.03);
        }

        .el-text {
            font-size: 1.5rem;
            color: #1e293b;
            text-align: center;
            user-select: text;
        }

        .el-shape {
            width: 100px;
            height: 100px;
            background: var(--accent);
        }
        .el-shape.circle { border-radius: 50%; }

        .el-image {
            max-width: 250px;
            max-height: 250px;
            object-fit: contain;
            pointer-events: none;
            border-radius: 8px;
        }

        /* Etiqueta informativa flutuante */
        .context-indicator {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #fff;
            padding: 2px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }
        .element.selected .context-indicator { opacity: 1; }

        /* MODO APRESENTAÇÃO A 100% (ECRÃ COMPLETO REAL) */
        .presentation-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .presentation-overlay .canvas {
            transform: scale(1.3);
            border-radius: 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .presentation-overlay .element {
            border: none !important;
            background: transparent !important;
        }
        
        .presentation-overlay .context-indicator {
            display: none !important;
        }

        /* CONTROLOS DA APRESENTAÇÃO */
        .pres-nav {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .pres-nav button {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            transition: all 0.2s;
            font-weight: 600;
        }

        .pres-nav button:hover {
            background: rgba(255,255,255,0.15);
            color: var(--accent);
        }

        .pres-nav .pres-indicator {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
            padding: 0 16px;
        }

        .hidden-trigger { display: none; }
    </style>
</head>
<body>

    <!-- DOCK FLUTUANTE EM TONS DE VERDE -->
    <div class="top-dock" id="topDock">
        <div class="dock-brand"><i class="fa-solid fa-leaf"></i> NEXUS</div>
        
        <!-- Gestão de Slides -->
        <div class="dock-group">
            <button class="dock-btn" id="addSlideBtn" title="Novo Slide"><i class="fa-solid fa-plus"></i></button>
            <button class="dock-btn" id="cloneSlideBtn" title="Clonar Slide"><i class="fa-solid fa-clone"></i></button>
            <button class="dock-btn" id="deleteBtn" title="Apagar Seleção ou Slide"><i class="fa-solid fa-trash-can"></i></button>
        </div>

        <div class="dock-divider"></div>

        <!-- Adicionar Elementos -->
        <div class="dock-group">
            <button class="dock-btn" id="insText"><i class="fa-solid fa-t"></i> Texto</button>
            <button class="dock-btn" id="insRect" title="Quadrado"><i class="fa-solid fa-square"></i></button>
            <button class="dock-btn" id="insCircle" title="Círculo"><i class="fa-solid fa-circle"></i></button>
            <button class="dock-btn" id="insImg" title="Imagem"><i class="fa-solid fa-images"></i></button>
        </div>

        <div class="dock-divider"></div>

        <!-- Formatação -->
        <div class="dock-group">
            <button class="dock-btn" id="txtBold"><i class="fa-solid fa-bold"></i></button>
            <button class="dock-btn" id="txtItalic"><i class="fa-solid fa-italic"></i></button>
            <button class="dock-btn" id="layerUp" title="Trazer para a Frente"><i class="fa-solid fa-layer-group"></i></button>
        </div>

        <div class="dock-divider"></div>

        <!-- Seleção de Cores Verde-Matching -->
        <div class="dock-group">
            <div class="color-pill">
                Fundo <input type="color" id="bgCol" value="#ffffff">
            </div>
            <div class="color-pill">
                Objeto <input type="color" id="fgCol" value="#10b981">
            </div>
        </div>

        <div class="dock-divider"></div>

        <!-- Exportar e Ver -->
        <div class="dock-group">
            <button class="dock-btn" id="exportPdfBtn"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            <button class="dock-btn primary" id="startPresBtn"><i class="fa-solid fa-play"></i> Apresentar</button>
        </div>
    </div>

    <!-- ÁREA DE TRABALHO -->
    <div class="workspace" id="workspace">
        <div class="slide-navigator">
            <div class="nav-title">Slides</div>
            <div id="navThumbsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <div class="stage-area">
            <div class="canvas-container" id="canvasContainer">
                <div class="canvas" id="mainCanvas"></div>
            </div>
        </div>
    </div>

    <!-- CAMADA EXCLUSIVA PARA APRESENTAÇÃO (A 100%) -->
    <div class="presentation-overlay" id="presOverlay">
        <div class="canvas" id="presCanvas"></div>
        <div class="pres-nav">
            <button id="presBack"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="pres-indicator" id="presIndicator">1 / 1</div>
            <button id="presNext"><i class="fa-solid fa-chevron-right"></i></button>
            <button id="presExit" style="color: #ef4444;"><i class="fa-solid fa-xmark"></i> Sair</button>
        </div>
    </div>

    <input type="file" id="imgFileLoader" class="hidden-trigger" accept="image/*">

    <!-- SCRIPT SEGURO E VERIFICADO -->
    <script>
        let slidesData = [{ background: '#ffffff', elements: [] }];
        let activeSlideIdx = 0;
        let activeDomElement = null;
        let dragActive = false;
        let ox, oy;
        let isPresenting = false;

        const mainCanvas = document.getElementById('mainCanvas');
        const presCanvas = document.getElementById('presCanvas');
        const presOverlay = document.getElementById('presOverlay');
        const presIndicator = document.getElementById('presIndicator');
        const navThumbsContainer = document.getElementById('navThumbsContainer');
        const bgCol = document.getElementById('bgCol');
        const fgCol = document.getElementById('fgCol');
        const imgFileLoader = document.getElementById('imgFileLoader');

        window.addEventListener('DOMContentLoaded', () => {
            renderNavigator();
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        // --- MOTOR DE RECONSTRUÇÃO DE SLIDES ---
        function renderSlide(targetCanvas, slideIdx, isPresentationMode) {
            targetCanvas.innerHTML = '';
            const data = slidesData[slideIdx];
            targetCanvas.style.backgroundColor = data.background;
            
            if(!isPresentationMode) {
                bgCol.value = data.background;
            }

            data.elements.forEach((el, index) => {
                const node = document.createElement('div');
                node.classList.add('element');
                node.dataset.index = index;
                node.style.left = el.x + 'px';
                node.style.top = el.y + 'px';
                node.style.zIndex = el.z || index;

                if (!isPresentationMode && activeDomElement && activeDomElement.dataset.index == index) {
                    node.classList.add('selected');
                }

                if (el.type === 'text') {
                    node.classList.add('el-text');
                    node.contentEditable = !isPresentationMode;
                    node.innerHTML = el.body;
                    node.style.fontWeight = el.b ? 'bold' : 'normal';
                    node.style.fontStyle = el.i ? 'italic' : 'normal';
                    node.style.color = el.color || '#1e293b';
                    
                    if(!isPresentationMode) {
                        node.addEventListener('blur', (e) => {
                            el.body = e.target.innerHTML;
                            renderNavigator();
                        });
                    }
                } else if (el.type === 'rect') {
                    node.classList.add('el-shape');
                    node.style.backgroundColor = el.color || '#10b981';
                } else if (el.type === 'circle') {
                    node.classList.add('el-shape', 'circle');
                    node.style.backgroundColor = el.color || '#10b981';
                } else if (el.type === 'image') {
                    const img = document.createElement('img');
                    img.src = el.body;
                    img.classList.add('el-image');
                    node.appendChild(img);
                }

                if(!isPresentationMode) {
                    const indicator = document.createElement('div');
                    indicator.classList.add('context-indicator');
                    indicator.innerText = el.type.toUpperCase();
                    node.appendChild(indicator);

                    node.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        selectNode(node);
                        dragActive = true;
                        ox = e.clientX - node.offsetLeft;
                        oy = e.clientY - node.offsetTop;
                    });
                }

                targetCanvas.appendChild(node);
            });
        }

        function renderNavigator() {
            navThumbsContainer.innerHTML = '';
            slidesData.forEach((slide, idx) => {
                const thumb = document.createElement('div');
                thumb.classList.add('thumb-box');
                if(idx === activeSlideIdx) thumb.classList.add('active');
                thumb.innerText = `Slide ${idx + 1}`;
                
                thumb.addEventListener('click', () => {
                    activeSlideIdx = idx;
                    selectNode(null);
                    renderNavigator();
                    renderSlide(mainCanvas, activeSlideIdx, false);
                });
                navThumbsContainer.appendChild(thumb);
            });
        }

        function selectNode(node) {
            if (activeDomElement) activeDomElement.classList.remove('selected');
            activeDomElement = node;
            if (activeDomElement) {
                activeDomElement.classList.add('selected');
                const elData = slidesData[activeSlideIdx].elements[node.dataset.index];
                if(elData.color) fgCol.value = elData.color;
            }
        }

        // --- ARRASTAR E SOLTAR ---
        window.addEventListener('mousemove', (e) => {
            if (!dragActive || !activeDomElement || isPresenting) return;
            const idx = activeDomElement.dataset.index;
            const elData = slidesData[activeSlideIdx].elements[idx];
            
            let nx = e.clientX - ox;
            let ny = e.clientY - oy;

            nx = Math.max(0, Math.min(nx, mainCanvas.clientWidth - activeDomElement.clientWidth));
            ny = Math.max(0, Math.min(ny, mainCanvas.clientHeight - activeDomElement.clientHeight));

            elData.x = nx;
            elData.y = ny;
            activeDomElement.style.left = nx + 'px';
            activeDomElement.style.top = ny + 'px';
        });

        window.addEventListener('mouseup', () => { dragActive = false; });
        mainCanvas.addEventListener('mousedown', () => { selectNode(null); });

        // --- LOGICA DE BOTÕES DO DOCK ---
        document.getElementById('addSlideBtn').addEventListener('click', () => {
            slidesData.push({ background: '#ffffff', elements: [] });
            activeSlideIdx = slidesData.length - 1;
            selectNode(null);
            renderNavigator();
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        document.getElementById('cloneSlideBtn').addEventListener('click', () => {
            const clone = JSON.parse(JSON.stringify(slidesData[activeSlideIdx]));
            slidesData.splice(activeSlideIdx + 1, 0, clone);
            activeSlideIdx++;
            selectNode(null);
            renderNavigator();
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        document.getElementById('deleteBtn').addEventListener('click', () => {
            if (activeDomElement) {
                slidesData[activeSlideIdx].elements.splice(activeDomElement.dataset.index, 1);
                selectNode(null);
                renderSlide(mainCanvas, activeSlideIdx, false);
            } else if (slidesData.length > 1) {
                slidesData.splice(activeSlideIdx, 1);
                activeSlideIdx = Math.max(0, activeSlideIdx - 1);
                renderNavigator();
                renderSlide(mainCanvas, activeSlideIdx, false);
            }
        });

        // Criar Objetos
        document.getElementById('insText').addEventListener('click', () => {
            slidesData[activeSlideIdx].elements.push({
                type: 'text', body: 'Duplo clique para editar', x: 300, y: 220, b: false, i: false, color: '#1e293b'
            });
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        document.getElementById('insRect').addEventListener('click', () => {
            slidesData[activeSlideIdx].elements.push({ type: 'rect', x: 370, y: 190, color: fgCol.value });
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        document.getElementById('insCircle').addEventListener('click', () => {
            slidesData[activeSlideIdx].elements.push({ type: 'circle', x: 370, y: 190, color: fgCol.value });
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        document.getElementById('insImg').addEventListener('click', () => imgFileLoader.click());
        imgFileLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    slidesData[activeSlideIdx].elements.push({ type: 'image', body: ev.target.result, x: 300, y: 110 });
                    renderSlide(mainCanvas, activeSlideIdx, false);
                };
                reader.readAsDataURL(file);
            }
        });

        // Estilos Rápidos
        document.getElementById('txtBold').addEventListener('click', () => {
            if (!activeDomElement) return;
            const el = slidesData[activeSlideIdx].elements[activeDomElement.dataset.index];
            if (el.type === 'text') { el.b = !el.b; renderSlide(mainCanvas, activeSlideIdx, false); }
        });

        document.getElementById('txtItalic').addEventListener('click', () => {
            if (!activeDomElement) return;
            const el = slidesData[activeSlideIdx].elements[activeDomElement.dataset.index];
            if (el.type === 'text') { el.i = !el.i; renderSlide(mainCanvas, activeSlideIdx, false); }
        });

        document.getElementById('layerUp').addEventListener('click', () => {
            if (!activeDomElement) return;
            const el = slidesData[activeSlideIdx].elements[activeDomElement.dataset.index];
            el.z = (el.z || 0) + 2;
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        bgCol.addEventListener('input', (e) => {
            slidesData[activeSlideIdx].background = e.target.value;
            mainCanvas.style.backgroundColor = e.target.value;
        });

        fgCol.addEventListener('input', (e) => {
            if (!activeDomElement) return;
            const el = slidesData[activeSlideIdx].elements[activeDomElement.dataset.index];
            el.color = e.target.value;
            renderSlide(mainCanvas, activeSlideIdx, false);
        });

        // --- ARQUITETURA DE APRESENTAÇÃO SEGURA (100% OPERIONAL) ---
        const startPresBtn = document.getElementById('startPresBtn');
        let presCurrentIdx = 0;

        function updatePresentationView() {
            renderSlide(presCanvas, presCurrentIdx, true);
            presIndicator.innerText = `${presCurrentIdx + 1} / ${slidesData.length}`;
        }

        startPresBtn.addEventListener('click', () => {
            selectNode(null);
            isPresenting = true;
            presCurrentIdx = activeSlideIdx; // Começa no slide onde estás a editar
            presOverlay.style.display = 'flex';
            updatePresentationView();
        });

        function closePresentation() {
            isPresenting = false;
            presOverlay.style.display = 'none';
            activeSlideIdx = presCurrentIdx; // Mantém a sincronização ao voltar
            renderNavigator();
            renderSlide(mainCanvas, activeSlideIdx, false);
        }

        document.getElementById('presExit').addEventListener('click', closePresentation);
        
        document.getElementById('presNext').addEventListener('click', () => {
            if (presCurrentIdx < slidesData.length - 1) { presCurrentIdx++; updatePresentationView(); }
        });
        
        document.getElementById('presBack').addEventListener('click', () => {
            if (presCurrentIdx > 0) { presCurrentIdx--; updatePresentationView(); }
        });

        // Interação por teclado para a apresentação
        window.addEventListener('keydown', (e) => {
            if (!isPresenting) return;
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (presCurrentIdx < slidesData.length - 1) { presCurrentIdx++; updatePresentationView(); }
            } else if (e.key === 'ArrowLeft') {
                if (presCurrentIdx > 0) { presCurrentIdx--; updatePresentationView(); }
            } else if (e.key === 'Escape') {
                closePresentation();
            }
        });

        // --- SISTEMA DE EXPEDIÇÃO PDF ---
        document.getElementById('exportPdfBtn').addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'px', [854, 480]);
            const backupIdx = activeSlideIdx;
            selectNode(null);

            for (let i = 0; i < slidesData.length; i++) {
                activeSlideIdx = i;
                renderSlide(mainCanvas, activeSlideIdx, true);
                await new Promise(r => setTimeout(r, 60));
                
                const snap = await html2canvas(mainCanvas, { scale: 1.5 });
                const base64 = snap.toDataURL('image/jpeg', 0.9);
                
                if (i > 0) doc.addPage([854, 480], 'l');
                doc.addImage(base64, 'JPEG', 0, 0, 854, 480);
            }
            doc.save('Apresentacao_Emerald.pdf');
            activeSlideIdx = backupIdx;
            renderNavigator();
            renderSlide(mainCanvas, activeSlideIdx, false);
        });
    </script>
</body>
</html>
